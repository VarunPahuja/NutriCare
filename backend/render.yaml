services:
  - type: web
    name: nutricare-api
    env: python
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
