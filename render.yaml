services:
  - type: web
    name: nutricare-api
    env: python
    buildCommand: pip install --only-binary=:all: -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
